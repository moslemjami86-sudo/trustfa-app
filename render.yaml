# TrustFa — Render Blueprint
# همه فایل‌ها در ریشه ریپو هستند (بدون پوشه backend)

services:
  - type: web
    name: trustfa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trustfa-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: trustfa-db
    plan: free
    databaseName: trustfa
    user: trustfa
